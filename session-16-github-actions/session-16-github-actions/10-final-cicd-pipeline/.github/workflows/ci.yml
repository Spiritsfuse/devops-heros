name: CI/CD Pipeline - Calculator App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================
  # CI: CONTINUOUS INTEGRATION
  # ==========================================
  test:
    name: Unit & Regression Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite (pytest)
        run: |
          pytest -v

  build:
    name: Build & Package Artifacts
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Application Package
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: build/

  security-scan:
    name: Repository Security Scan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Secret Leak Prevention
        run: |
          echo "Scanning for accidentally committed credentials or secrets..."
          if find . -type f \( -name ".env" -o -name "*.pem" -o -name "*.key" \) | grep -q .; then
            echo "Security Alert: Sensitive file found!"
            exit 1
          else
            echo "Security Pass: No unencrypted secrets detected."
          fi

  # ==========================================
  # CD: CONTINUOUS DELIVERY / DEPLOYMENT
  # ==========================================
  cd-deploy:
    name: Continuous Delivery & Container Packaging
    needs: [build, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: calculator-build
          path: build/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        run: |
          docker build -t calculator-app:${{ github.sha }} .
          echo "Container image calculator-app:${{ github.sha }} successfully built and packaged."

      - name: Deploy Staging Verification
        run: |
          echo "Simulating automated deployment to Staging environment..."
          echo "Deployment completed successfully for commit ${{ github.sha }}."
